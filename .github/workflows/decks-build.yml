name: Decks build

on:
  # Every pull request, without path filters: "All decks build" is a
  # required check (the "main" ruleset), and a filtered-out workflow
  # would leave it pending forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - decks/**
      - theme/**
      - scripts/write-htaccess.mjs
      - package.json
      - package-lock.json
      - .github/workflows/decks-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.deck }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deck:
          - playwright-training
          - agents-skills-101
          - testcontainers
          - keep-your-minions-in-line
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One lockfile for all decks (npm workspaces), so install at the root.
      - run: npm ci

      - run: npm run build -w decks/${{ matrix.deck }}

  # One stable check for the ruleset, however many decks the matrix has.
  all-decks:
    name: All decks build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.build.result }}
