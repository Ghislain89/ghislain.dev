name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "playwright/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghislain.dev/playwright/preparation.html
    steps:
      - uses: actions/checkout@v7

      - name: Check that the FTP password is set
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP password first: gh secret set FTP_PASSWORD --repo ${{ github.repository }}"
            exit 1
          fi

      # Uploads only changed files; the state file on the server tracks what was deployed.
      - name: Upload to mijn.host
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: h64.mijn.host
          username: ghislain@ghislain.dev
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./playwright/
          server-dir: public_html/playwright/

      - name: Check the live pages
        run: |
          for page in preparation.html assignments.html style.css; do
            curl --fail --silent --show-error --output /dev/null "https://ghislain.dev/playwright/$page?v=$GITHUB_SHA"
            echo "ok: $page"
          done
