name: Deploy

on:
  push:
    branches: [main]
    paths:
      - decks/**
      - theme/**
      - scripts/write-htaccess.mjs
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ matrix.deck }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One SFTP connection at a time: the host's firewall dislikes bursts.
      max-parallel: 1
      matrix:
        include:
          - deck: playwright-training
            server-dir: public_html/playwright/slides
            url: https://ghislain.dev/playwright/slides
            check: ui/ ui/5 api/ api/5
          - deck: testcontainers
            server-dir: public_html/slides/testcontainers
            url: https://ghislain.dev/slides/testcontainers
            check: "/ 5"
          - deck: agents-skills-101
            server-dir: public_html/slides/agents-skills-101
            url: https://ghislain.dev/slides/agents-skills-101
            check: "/ 5"
    environment:
      name: production
      url: ${{ matrix.url }}/
    defaults:
      run:
        working-directory: decks/${{ matrix.deck }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the FTP password is set
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP password first: gh secret set FTP_PASSWORD --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decks/${{ matrix.deck }}/package-lock.json

      - run: npm ci

      - run: npm run build

      # Same upload action as the ghislain.dev site: only changed files are sent.
      - name: Upload to mijn.host
        uses: Ghislain89/ghislain.dev/.github/actions/sftp-upload@main
        with:
          local-dir: decks/${{ matrix.deck }}/dist
          server-dir: ${{ matrix.server-dir }}
          public-url: ${{ matrix.url }}
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Check the live deck
        env:
          URL: ${{ matrix.url }}
          CHECK: ${{ matrix.check }}
        run: |
          for path in $CHECK; do
            curl --fail --silent --show-error --output /dev/null "$URL/${path#/}?v=$GITHUB_SHA"
            echo "ok: $URL/${path#/}"
          done
