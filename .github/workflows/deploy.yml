name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "playwright/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/sftp-upload/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghislain.dev/playwright/
    steps:
      - uses: actions/checkout@v7

      - name: Check that the FTP password is set
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP password first: gh secret set FTP_PASSWORD --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Upload to mijn.host
        uses: ./.github/actions/sftp-upload
        with:
          local-dir: playwright
          server-dir: public_html/playwright
          public-url: https://ghislain.dev/playwright
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Check the live pages
        run: |
          for page in "" assignments.html slides.html style.css; do
            curl --fail --silent --show-error --output /dev/null "https://ghislain.dev/playwright/$page?v=$GITHUB_SHA"
            echo "ok: /playwright/$page"
          done
