name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "playwright/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghislain.dev/playwright/preparation.html
    steps:
      - uses: actions/checkout@v7

      - name: Check that the FTP password is set
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP password first: gh secret set FTP_PASSWORD --repo ${{ github.repository }}"
            exit 1
          fi

      # curl instead of an FTP action: ProFTPD on mijn.host requires TLS session reuse
      # on the data connection, which the Node-based FTP actions fail on (ECONNRESET).
      - name: Upload to mijn.host
        env:
          FTP_HOST: h64.mijn.host
          FTP_USER: ghislain@ghislain.dev
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        working-directory: playwright
        run: |
          netrc="$RUNNER_TEMP/netrc"
          trap 'rm -f "$netrc"' EXIT
          (umask 077 && printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD" > "$netrc")
          find . -type f | sort | while read -r file; do
            file="${file#./}"
            curl --fail --silent --show-error --retry 3 \
              --ssl-reqd --ftp-create-dirs --netrc-file "$netrc" \
              --upload-file "$file" "ftp://$FTP_HOST/public_html/playwright/$file"
            echo "uploaded: $file"
          done

      - name: Check the live pages
        run: |
          for page in preparation.html assignments.html style.css; do
            curl --fail --silent --show-error --output /dev/null "https://ghislain.dev/playwright/$page?v=$GITHUB_SHA"
            echo "ok: $page"
          done
