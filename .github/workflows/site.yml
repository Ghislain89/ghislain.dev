name: Site

on:
  push:
    branches: [main]
    paths:
      - "home/**"
      - "playwright/**"
      - "theme/styles/tokens.css"
      - "scripts/build-site.mjs"
      - ".github/workflows/site.yml"
      - ".github/actions/sftp-upload/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghislain.dev/
    steps:
      - uses: actions/checkout@v7

      - name: Check that the FTP password is set
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP password first: gh secret set FTP_PASSWORD --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # home/ at the root, playwright/ and the shared theme/tokens.css next to it.
      - run: node scripts/build-site.mjs

      - name: Upload the site
        uses: ./.github/actions/sftp-upload
        with:
          local-dir: dist/site
          server-dir: public_html
          public-url: https://ghislain.dev
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Check the live pages
        run: |
          for page in "" theme/tokens.css ghislain.webp street.webp skyline.webp favicon.png og-image.png playwright/ playwright/assignments.html playwright/slides.html playwright/style.css; do
            curl --fail --silent --show-error --output /dev/null "https://ghislain.dev/$page?v=$GITHUB_SHA"
            echo "ok: /$page"
          done
          curl --fail --silent "https://ghislain.dev/?v=$GITHUB_SHA" | grep -q "Hi, I'm Ghislain" || { echo "::error::/ does not serve home/index.html"; exit 1; }
          location=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "https://ghislain.dev/slides/")
          [ "$location" = "https://ghislain.dev/#talks" ] || { echo "::error::/slides/ redirects to '$location' instead of /#talks"; exit 1; }
